# ASTRA Analysis Specification

spec_version: "0.1.0"
label: "noise-models"
description: >-
  Noise models for the 40 temperature sensors (s01 to s40), measured in a
  climate chamber held at constant temperature for one week of 10-second
  readings. Each sensor's noise is fitted as white noise plus a 1/f-type
  component through its power spectral density, P(f) = (2 σ_w² / fs) ·
  [1 + (f_knee / f)^α], so that other projects can look a sensor up by its id
  and simulate or weight its noise. The spectrum is estimated with Welch's
  method, under both a Hann and a Blackman window, and the 1/f slope α is
  either fitted per sensor or held at exactly 1.

inputs:
  chamber_run:
    label: Climate-chamber run
    path: data/chamber-run.csv
    description: >-
      One week (2022-12-12 to 2022-12-18, UTC) of readings from all 40 sensors
      in a climate chamber at constant temperature, one reading every 10
      seconds per sensor, 60,480 per sensor, none missing. Columns time
      (ISO 8601, UTC), sensor (s01 to s40, the ids the sensors keep outside
      the chamber) and temp_c, in steps of 0.01 °C. SHA-256
      beffebaa43f49a110f3cead5666c42f001086bbfb2854950e434467c1f836791, as
      the delivery's SHA256SUMS lists.

decisions:
  window:
    label: Welch window
    rationale: >-
      Most sensors' spectra rise steeply toward low frequency, so a window's
      leakage can carry low-frequency power up onto the white floor and bias
      σ_w high. Blackman's sidelobes sit far lower than Hann's (about -58 dB
      against -31 dB), which limits that leakage, but its main lobe is wider,
      so neighbouring frequency bins are more correlated and the resolution
      near the lowest frequencies is coarser. Which matters more for these
      sensors is not known in advance, so both are built.
    options:
      hann:
        label: Hann
        description: scipy.signal.get_window("hann", n), periodic.
      blackman:
        label: Blackman
        description: scipy.signal.get_window("blackman", n), periodic.

  segment_length:
    label: Welch segment length
    rationale: >-
      Longer segments reach lower frequencies, which constrain α and f_knee;
      shorter ones average more segments, which narrows each bin's scatter.
      One day with half overlap gives 13 segments over the week and fits from
      3 / 86400 s ≈ 3.5e-5 Hz. Six hours would fit only from 1.4e-4 Hz, above
      the knee of several sensors, leaving their 1/f slope poorly pinned. It
      is recorded as an alternative but not built.
    options:
      one_day:
        label: One day (8640 readings)
      six_hours:
        label: Six hours (2160 readings)

  slope:
    label: 1/f slope
    rationale: >-
      Fitted freely, the 40 slopes cluster tightly around 1, and with α free
      its uncertainty is shared with f_knee and σ_w. Holding α at exactly 1,
      the textbook 1/f, narrows f_knee and σ_w, and makes the model the
      simplest one, P(f) = W + K/f. Within the measured band the two models
      predict nearly the same spectrum; they part below it, where a held slope
      gives narrow uncertainties that are only right if the sensor's slope
      really is 1. slope_test measures whether the data allow that, sensor by
      sensor and for all 40 together. Both are built.
    options:
      free:
        label: Fitted with σ_w and f_knee
      one:
        label: Held at exactly 1

outputs:
  welch_psd:
    label: Welch power spectral densities
    type: data
    format: npz
    description: >-
      One-sided PSD in °C²/Hz of every sensor's readings (psd_c2_per_hz,
      sensors × freq_hz), half-overlapping segments, each segment's mean
      removed before windowing. Also holds the sensors' ids, the sampling
      rate, the window, segmenting, the estimate's equivalent degrees of
      freedom (Percival & Walden eq. 292b), and each sensor's mean and
      standard deviation over the week.
    inputs: [chamber_run]
    decisions: [window, segment_length]
    recipe:
      command: >-
        python src/welch_psd.py {inputs.chamber_run} {decisions.window}
        {decisions.segment_length} {output}
      resources:
        cpus: 4
        memory: 8Gi

  noise_models:
    label: Noise model per sensor
    type: table
    format: csv
    description: >-
      One row per sensor: the fitted white-noise level sigma_white_c (°C per
      10-second reading) and white_psd_c2_per_hz (2 σ_w² / fs, the same level
      independent of sampling rate), the knee f_knee_hz and slope alpha of the
      1/f part, each with a 1σ uncertainty (_err) from a 200-draw parametric
      bootstrap through the same Welch estimate and fit. Under the `slope`
      decision's `one`, alpha is 1 for every sensor, alpha_err is 0 and
      alpha_fixed is true. The fit maximises the
      Whittle likelihood over the bins from the third above zero up to, not
      including, Nyquist. knee_above_nyquist marks sensors whose white floor
      lies above every measured frequency, so σ_w is an extrapolation of the
      model there. low_band_ratio (mean data / model over the lowest decade
      fitted) and low_band_ratio_z (its distance from the bootstrap's, in
      bootstrap σ) test the 1/f shape where the data stretch it most. Also
      mean_c and std_c over the week; with 1/f noise std_c grows with the
      length of the record, so it does not carry over to other durations.
    inputs: [welch_psd]
    decisions: [slope]
    recipe:
      command: python src/fit_noise.py {inputs.welch_psd} {decisions.slope} {output}
      resources:
        cpus: 8
        memory: 8Gi

  psd_fits:
    label: Spectra and fits, every sensor
    type: figure
    format: png
    description: >-
      One panel per sensor: the Welch estimate, the fitted model, the white
      floor and, where it falls below Nyquist, the knee.
    inputs: [welch_psd, noise_models]
    recipe:
      command: python src/plot_psd_fits.py {inputs.welch_psd} {inputs.noise_models} {output}

  window_difference:
    label: Hann against Blackman, in numbers
    type: metric
    format: json
    description: >-
      For σ_w, f_knee and a fitted α, the largest difference between the
      Blackman and Hann fits across the sensors (relative for σ_w and
      f_knee), which sensor it is, and the largest and median difference in
      units of the Hann fit's bootstrap uncertainty: once for the free slope
      (slope_free) and once for the slope held at 1 (slope_one).
    inputs:
      - noise_models#hann
      - noise_models#blackman
      - noise_models#hann_slope_one
      - noise_models#blackman_slope_one
    recipe:
      command: >-
        python src/window_difference.py {inputs.noise_models#hann}
        {inputs.noise_models#blackman} {inputs.noise_models#hann_slope_one}
        {inputs.noise_models#blackman_slope_one} {output}

  window_comparison:
    label: Hann against Blackman, per sensor
    type: figure
    format: png
    description: >-
      The Blackman-minus-Hann difference in σ_w, f_knee and α for every
      sensor, against the Hann fit's ±1σ uncertainty.
    inputs: [noise_models#hann, noise_models#blackman]
    recipe:
      command: >-
        python src/plot_window_comparison.py {inputs.noise_models#hann}
        {inputs.noise_models#blackman} {output}

  slope_test:
    label: Is the 1/f slope 1?
    type: metric
    format: json
    description: >-
      From the free-slope and held-slope fits under the Hann window: the χ² of
      (α − 1)/σ_α over all sensors and its p-value, the precision-weighted
      mean slope, and the slopes' intrinsic scatter about their common mean
      (maximum likelihood and one-sided 95% upper limit). Then each sensor
      whose free slope is more than 2σ from 1, beside how many that many
      sensors give by chance, with how far holding its slope at 1 moves its
      σ_w and f_knee in units of the free fit's uncertainty. Last, the median
      ratio of the held fit's uncertainties to the free fit's.
    inputs: [noise_models#hann, noise_models#hann_slope_one]
    recipe:
      command: >-
        python src/slope_test.py {inputs.noise_models#hann}
        {inputs.noise_models#hann_slope_one} {output}

  slope_comparison:
    label: Free slope against slope held at 1, per sensor
    type: figure
    format: png
    description: >-
      Each sensor's free slope against 1, and the held fit's σ_w and f_knee
      relative to the free fit's, with both fits' ±1σ uncertainties (Hann
      window).
    inputs: [noise_models#hann, noise_models#hann_slope_one]
    recipe:
      command: >-
        python src/plot_slope_comparison.py {inputs.noise_models#hann}
        {inputs.noise_models#hann_slope_one} {output}

  chamber_check:
    label: Chamber stability check
    type: metric
    format: json
    description: >-
      Whether the chamber held still: the spread of the across-sensor mean
      against what independent sensor noise alone gives, and the sensors'
      pairwise correlations, on the readings and on hourly means. Each
      statistic has the 95% range of a null in which every sensor is
      circularly shifted by its own random offset (200 draws), which keeps
      each sensor's spectrum and removes anything they share.
    inputs: [chamber_run]
    recipe:
      command: python src/chamber_check.py {inputs.chamber_run} {output}
      resources:
        cpus: 2
        memory: 8Gi

universes:
  hann:
    label: Hann window, slope fitted
    decisions:
      window: hann
      segment_length: one_day
      slope: free
  blackman:
    label: Blackman window, slope fitted
    derived_from: hann
    decisions:
      window: blackman
  hann_slope_one:
    label: Hann window, slope held at 1 (the default)
    derived_from: hann
    decisions:
      slope: one
  blackman_slope_one:
    label: Blackman window, slope held at 1
    derived_from: blackman
    decisions:
      slope: one

findings:
  window_choice_immaterial:
    claim: >-
      For every sensor, the Hann and Blackman windows give the same noise
      model within the fits' own uncertainty, whether the slope is fitted or
      held at 1: σ_w differs by under 1%, and no parameter of any sensor moves
      by more than 0.74 of its 1σ bootstrap uncertainty. Either window's
      models can be used.
    evidence:
      - artifact: window_difference
        quote: { exact: '"max_abs_relative_difference": 0.0095' }
      - artifact: window_difference
        quote: { exact: '"max_abs_difference_in_errors": 0.736' }

  chamber_held_still:
    claim: >-
      The chamber held still: the across-sensor mean of the readings, and of
      their hourly means, varies no more than independent sensor noise alone
      predicts, inside the 95% range of the circular-shift null, so what each
      sensor recorded is its own noise.
    evidence:
      - artifact: chamber_check
        quote: { exact: '"ratio": 0.97078' }
      - artifact: chamber_check
        quote: { exact: '"ratio": 0.87022' }

  slope_one_allowed:
    claim: >-
      Taken together, the 40 sensors' free 1/f slopes are consistent with
      exactly 1, and their intrinsic scatter about a common slope is at most
      0.019 (95%). Holding α at 1 narrows the uncertainty on f_knee by about a
      third. Sensor s38 alone is in tension with α = 1, at 3.3σ, which among
      40 sensors is about a one-in-ten chance, so the held-slope models are
      the default for every sensor, s38 included.
    evidence:
      - artifact: slope_test
        quote: { exact: '"p_value": 0.168' }
      - artifact: slope_test
        quote: { exact: '"intrinsic_scatter_95_upper": 0.0189' }
      - artifact: slope_test
        quote: { exact: '"median_err_ratio_fixed_over_free_f_knee": 0.66' }
      - artifact: slope_test
        quote: { exact: '"alpha_minus_one_in_errors": 3.28' }
      - artifact: slope_test
        quote: { exact: '"beyond_3_sigma_expected_by_chance": 0.11' }
